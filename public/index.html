<!doctype html>
<!--
  PREVIEW shell: open this file via the server (http://HOST:8080/preview/)
  to see header + body stub + footer composed on one A4 page.
  Do NOT open via file:// — translations load with fetch() and need HTTP.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invoice layout preview</title>
<style>
  @font-face {
    font-family: "Open Sans";
    src: url("/fonts/OpenSans-Regular.ttf") format("truetype");
    font-weight: 400;
  }
  @font-face {
    font-family: "Open Sans";
    src: url("/fonts/OpenSans-ExtraBold.ttf") format("truetype");
    font-weight: 800;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #888;
    font-family: "Open Sans", sans-serif;
    font-size: 11pt;
  }
  .page {
    width: 794px; /* A4 @96dpi */
    margin: 24px auto;
    background: #fff;
    padding: 40px 40px 40px 72px; /* top/right/bottom 30pt, left 54pt */
    box-shadow: 0 2px 12px rgba(0,0,0,.4);
  }
  iframe { width: 100%; border: 0; display: block; }
  #header-frame { height: 640px; }
  #footer-frame { height: 260px; }
  .body-stub {
    border: 2px dashed #999;
    min-height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    margin: 8px 0;
  }
  .toolbar {
    width: 794px;
    margin: 12px auto;
    color: #fff;
    font-size: 10pt;
  }
  .toolbar a { color: #fff; }
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .page { box-shadow: none; margin: 0; }
    .body-stub { border: 0; color: #bbb; }
  }
  @page { size: A4; margin: 10.6mm 10.6mm 10.6mm 19mm; }
</style>
</head>
<body>
<div class="toolbar">
  Preview assembled from
  <a href="/preview/header.html">header.html</a> +
  body stub (table rendered by pdfkit code) +
  <a href="/preview/footer.html">footer.html</a>.
  Switch language with the select inside the header.
</div>
<div class="page">
  <iframe id="header-frame" src="/preview/header.html" title="header"></iframe>
  <div class="body-stub">BODY — items table generated by code (variable height)</div>
  <iframe id="footer-frame" src="/preview/footer.html" title="footer"></iframe>
</div>
</body>
</html>
