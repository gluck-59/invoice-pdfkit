<!doctype html>
<!--
  PREVIEW shell: open this file via the server (http://HOST:8080/preview/)
  to see header + body stub + footer composed on one A4 page.
  Do NOT open via file:// — translations load with fetch() and need HTTP.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invoice layout preview</title>
<style>
  @font-face {
    font-family: "Open Sans";
    src: url("/fonts/OpenSans-Regular.ttf") format("truetype");
    font-weight: 400;
  }
  @font-face {
    font-family: "Open Sans";
    src: url("/fonts/OpenSans-Bold.ttf") format("truetype");
    font-weight: 700;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #888;
    font-family: "Open Sans", sans-serif;
    font-size: 11pt;
  }
  .page {
    width: 794px; /* A4 @96dpi */
    margin: 24px auto;
    background: #fff;
    padding: 40px 40px 40px 72px; /* top/right/bottom 30pt, left 54pt */
    box-shadow: 0 2px 12px rgba(0,0,0,.4);
  }
  #header-frame, #footer-frame { width: 100%; } /* auto height: content defines it */
  .body-stub {
    /*border: 2px dashed #999;*/
    /*min-height: 220px;*/
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    margin: 8px 0;
  }
  @media print {
    body { background: #fff; }
    .page { box-shadow: none; margin: 0; }
    .body-stub { border: 0; color: #bbb; }
  }
  @page { size: A4; margin: 10.6mm 10.6mm 10.6mm 19mm; }
</style>
</head>
<body>
<div class="page">
  <div id="header-frame"></div>
  <div class="body-stub">BODY — items table generated by code (variable height)</div>
  <div id="footer-frame"></div>
</div>
<script src="/preview/i18n.js" defer></script>
<script>
// Preview shell: header/footer are plain divs (auto height).
// Their markup + styles are fetched from the standalone template files
// and injected; ?lang= is read from this page's own URL by i18n.js.
(function () {
  var base = location.pathname.indexOf("/template") === 0 ? "/template" : "/preview";
  function part(url, targetId) {
    return fetch(url)
      .then(function (r) {
        if (!r.ok) throw new Error("load failed: " + url);
        return r.text();
      })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, "text/html");
        doc.querySelectorAll("head style, head link[rel=stylesheet]").forEach(function (n) {
          document.head.appendChild(n.cloneNode(true));
        });
        doc.querySelectorAll("script").forEach(function (n) {
          n.remove();
        });
        document.getElementById(targetId).innerHTML = doc.body.innerHTML;
      });
  }
  Promise.all([
    part(base + "/header.html", "header-frame"),
    part(base + "/footer.html", "footer-frame"),
  ])
    .then(function () {
      window.PdfI18n.init();
    })
    .catch(function (err) {
      console.error(err);
    });
})();
</script>
</body>
</html>
