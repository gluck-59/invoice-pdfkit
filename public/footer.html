<!doctype html>
<!--
  FOOTER prototype (fixed bottom zone). Edit freely in any HTML editor.
  Values are literal {{placeholders}}. Labels via data-i18n.
  Language follows the header's <select> (localStorage + storage events).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invoice footer prototype</title>
<style>
  @font-face {
    font-family: "Open Sans";
    src: url("/fonts/OpenSans-Regular.ttf") format("truetype");
    font-weight: 400;
  }
  @font-face {
    font-family: "Open Sans";
    src: url("/fonts/OpenSans-ExtraBold.ttf") format("truetype");
    font-weight: 800;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Open Sans", sans-serif;
    font-size: 11pt;
    color: #000;
  }
  .footer-zone {
    width: 678px; /* A4 minus pdfkit margins (left 54pt / right 30pt) */
    min-height: 160px; /* fixed zone — tune in editor */
  }
  .small { font-size: 9.9pt; }
  .block-title { font-weight: 800; font-size: 9.9pt; }
  .terms-line { margin: 2px 0; }
  .page-no { text-align: right; margin-top: 12px; }
</style>
</head>
<body>
<div class="footer-zone">
  <div class="block-title" data-i18n="terms">Terms &amp; Conditions</div>
  <div class="terms-line small"><span data-i18n="terms_site">Full terms and conditions are described at</span> {{company.termsURL}}</div>
  <div class="terms-line small" data-i18n="terms_due">Invoice must be paid no later than the due date.</div>
  <div class="terms-line small">{{company.terms}}</div>
  <div class="terms-line small">{{company.tagline}}</div>
  <div class="page-no small"><span data-i18n="page">Page</span> {{page}} / {{pages}}</div>
</div>
<script src="/preview/i18n.js"></script>
<script>window.PdfI18n.init();</script>
</body>
</html>
